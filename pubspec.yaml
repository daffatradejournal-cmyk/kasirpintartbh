name: inhil_pos_mobile
description: "InhilPOS Mobile - Smart Point of Sale & Inventory Management for MSMEs in Indragiri Hilir"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Storage & Database (Offline-First)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Formatting, Utils & IDs
  intl: ^0.19.0
  uuid: ^4.4.0

  # Hardware & Scanner
  mobile_scanner: ^5.1.1
  blue_thermal_printer: ^1.2.3
  pdf: ^3.10.8
  printing: ^5.12.0

  # Charts & UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Sharing & External Actions (E-Receipt WA)
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
