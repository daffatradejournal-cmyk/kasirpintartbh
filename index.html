<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Pintar - Point of Sale & Smart Stock UMKM</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <style>
      /* Jagged / Sawtooth Receipt Edge Effect */
      .receipt-paper {
        background: #FEFDF9;
        position: relative;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.05);
      }
      .receipt-paper::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 0;
        right: 0;
        height: 6px;
        background: radial-gradient(circle, transparent, transparent 50%, #FEFDF9 50%, #FEFDF9 100%);
        background-size: 12px 12px;
      }
      .receipt-paper::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        right: 0;
        height: 6px;
        background: radial-gradient(circle, transparent, transparent 50%, #FEFDF9 50%, #FEFDF9 100%);
        background-size: 12px 12px;
      }

      /* Native thermal printer formatting */
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-receipt, #printable-receipt * {
          visibility: visible;
        }
        #printable-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 58mm;
          margin: 0;
          padding: 8px;
          background: white !important;
          color: black !important;
          font-family: 'JetBrains Mono', monospace !important;
          box-shadow: none !important;
        }
        #printable-receipt::before,
        #printable-receipt::after {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#F6F8F7] text-[#0F172A] antialiased select-none font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
